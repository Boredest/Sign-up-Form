<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <section class="left">
        <h1 class="left-header">Title</h1>
        <img src="images/survey.svg" alt="logo" />
        <p>Sign up today for special offers..!</p>
      </section>
      <section class="right">
        <h2 class="Get Started">Header Text</h2>
        <form>
          <div class="form-header"><h2>Test</h2></div>
          <div class="form-body">
          <div class="form-row">
          <div class="form-group">
            <label for="name">First Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="name">Last Name</label>
            <input type="text" id="name" required />
          </div>
          </div>
          
          <div class="form-row">
          <div class="form-group">
            <label for="mail">Email</label>
            <input type="email" id="mail" required />
          </div>
          

          <div class="form-group">
            <label for="phone">Phone</label>
            <input
              type="tel"
              id="phone"
              pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
              required
            />
          </div>

          </div>
          <div class="form-row">
          <div class="form-group">
            <label for="pwd">Password</label>
            <input type="password" id="pwd" name="password" required />
          </div>
          <div class="form-group">
            <label for="confirm-pwd">Confirm Password</label>
            <input type="password" id="confirm-pwd" required />
          </div>
          </div>
          </div>
          <button class="form-btn">Create Account</button>
        </form>
      </section>
    </div>
  </body>
</html>
